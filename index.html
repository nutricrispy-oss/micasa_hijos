<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Responsabilidades del hogar, evidencias, progreso y recompensas para toda la familia.">
  <title>Mi Casa – Mis Responsabilidades</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema antes de dibujar para evitar parpadeo
    (function () {
      var t = localStorage.getItem('mc_theme') || 'auto';
      var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div id="app"><div class="spinner"></div></div>
  <noscript>Esta aplicación necesita JavaScript activado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
